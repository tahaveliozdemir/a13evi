name: Build Birim Mali Takip APK

on:
  pull_request:
    branches: ["main"]
    paths:
      - "android-apk/**"
      - ".github/workflows/birim-mali-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ensure Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build APK
        run: gradle -p android-apk assembleDebug --no-daemon

      - name: Prepare artifact
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Birim-Mali-Takip.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Birim-Mali-Takip-APK
          path: Birim-Mali-Takip.apk
          if-no-files-found: error
