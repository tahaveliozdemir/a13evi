name: Build Birim Mali Takip APK

on:
  push:
    branches: ["birim-mali-apk"]
    paths:
      - "android-apk/**"
      - ".github/workflows/birim-mali-apk.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android-apk/**"
      - ".github/workflows/birim-mali-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ensure Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build APK
        run: gradle -p android-apk assembleDebug --no-daemon

      - name: Prepare artifact
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Birim-Mali-Takip.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Birim-Mali-Takip-APK
          path: Birim-Mali-Takip.apk
          if-no-files-found: error

      - name: Publish APK to build branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Birim-Mali-Takip.apk
          git commit -m "Publish latest Birim Mali Takip APK" || exit 0
          git push
